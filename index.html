<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Hora do Filme</title>
    <style>
        body {
            background-color: #0a0a0a; 
            color: #ffffff; 
            font-family: Arial;
            margin: 0;
            padding: 0;
            text-align: center;
        }
        
        header {
            background-color: #111;
            padding: 30px;
            border-bottom: 4px solid #e50914; 
        }
        
        header h1 {
            color: #e50914; 
            margin: 0;
            font-size: 32px;
        }
        
        header p {
            color: #cccccc;
            margin: 5px 0 0 0;
        }

        main {
            padding: 60px 20px;
        }

        article {
            background-color: #1a1a1a;
            padding: 20px;
            margin: 20px auto;
            max-width: 600px;
            border-radius: 8px;
            text-align: left;
        }

        article img {
            width: 100%;
            border-radius: 5px;
        }

        .artigo-autor {
            color: #aaaaaa;
            font-size: 14px;
        }

        button {
            background-color: #e50914;
            color: white;
            border: none;
            padding: 8px 12px;
            margin-right: 10px;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <h1>Sejam bem vindos a hora do filme!</h1>
        <p>Aqui mostramos sobre filmes, séries e tudo que há de bom sobre cinema!</p>
    </header>

    <main>
        <p>Se você estiver procurando resenhas de filmes e séries, o lugar é aqui!</p>

        <article>
            <img src="imagem-blog.png" alt="Descrição da imagem para acessibilidade">
            <div>
                <h2>Vocês ja assistiram iCARLY?/h2>
                <p class="artigo-autor">Por: servante,pietra.</p>
                <p>para sim aperte❤️ para não aperte💬, ate mais!.</p>
                
                <button>❤️ <span>0</span></button>
                <button>💬 <span>0</span></button>
            </div>
        </article>

    </main>

</body>
</html>
